<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swiper Thumbs</title>

  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <style>
    body {
      background-color: #c99b58; /* Matches your background */
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
    }

    /* 
      The Container: 
      We place the Small Thumb slider and Big Main slider inside here.
    */
    .gallery-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 80vh;
      margin: 20px;
    }

    /* --- 1. THE BIG IMAGE (Main Slider) --- */
    .swiper-main {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1; /* Behind */
    }

    .swiper-main .swiper-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* --- 2. THE SMALL IMAGE (Thumbs Slider) --- */
    /* This is positioned absolute on top of the main slider */
    .swiper-thumbs {
      position: absolute;
      top: 5%;
      left: 5%;
      width: 35%;       /* Size relative to big image */
      max-width: 300px;
      height: auto;
      z-index: 10;      /* On top */
      
      /* Styling for the frame */
      border: 4px solid #fff;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      background: #000;
    }

    .swiper-thumbs .swiper-slide {
      opacity: 0.4;
      cursor: pointer;
      transition: opacity 0.3s;
    }

    /* The active thumb is fully visible */
    .swiper-thumbs .swiper-slide-thumb-active {
      opacity: 1;
    }

    .swiper-thumbs .swiper-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Navigation Arrows */
    .swiper-button-next, .swiper-button-prev {
      color: #fff;
      background: rgba(0,0,0,0.4);
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }
    
    .swiper-button-next { right: 10px; }
    .swiper-button-prev { left: 10px; }
    
    .swiper-button-next:after, .swiper-button-prev:after {
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="gallery-container">
    
    <!-- A. THE SMALL IMAGE (Thumbs Slider) -->
    <!-- This is no longer static; it is its own slider linked to the main one -->
    <div class="swiper swiper-thumbs">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <img src="themes/custom/sao_tome/assets/img/team/Groupe-20-268x300-1.png.png" />
        </div>
        <!-- Thumb 1 (Costumed Group) -->
        <div class="swiper-slide">
          <img src="themes/custom/sao_tome/assets/img/team/Groupe-24-262x300-1.png.png" />
        </div>
        <!-- Thumb 2 (Women on Steps) -->
        <div class="swiper-slide">
          <img src="themes/custom/sao_tome/assets/img/team/Groupe-22-273x300-1.png.png" />
        </div>
        <div class="swiper-slide">
          <img src="themes/custom/sao_tome/assets/img/team/Groupe-20-268x300-1.png.png" />
        </div>
      </div>
    </div>

    <!-- B. THE BIG IMAGE (Main Slider) -->
    <div class="swiper swiper-main">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <img src="themes/custom/sao_tome/assets/img/anda.png" />
        </div>
        <!-- Main 1 -->
        <div class="swiper-slide">
          <img src="themes/custom/sao_tome/assets/img/team/Groupe-20-268x300-1.png.png" />
        </div>
        <!-- Main 2 -->
       <div class="swiper-slide">
          <img src="themes/custom/sao_tome/assets/img/team/Groupe-24-262x300-1.png.png" />
        </div>
        <div class="swiper-slide">
          <img src="themes/custom/sao_tome/assets/img/team/Groupe-22-273x300-1.png.png" />
        </div>
      </div>
      
      <!-- Navigation -->
      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
    </div>

  </div>

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <script>
  // 1. Initialize the Thumbs (Small) slider with LOOP enabled
    var swiperThumbs = new Swiper(".swiper-thumbs", {
      spaceBetween: 10,
      slidesPerView: 1, 
      freeMode: true,
      watchSlidesProgress: true,
      loop: true,              // Enable infinite loop
      loopedSlides: 3,         // Must match or exceed total number of slides
    });

    // 2. Initialize the Main (Big) slider and link it to the Thumbs
    var swiperMain = new Swiper(".swiper-main", {
      spaceBetween: 10,
      loop: true,              // Enable infinite loop
      loopedSlides: 3,         // Sync looped slides with thumbs
      navigation: {
        nextEl: ".swiper-button-next",
        prevEl: ".swiper-button-prev",
      },
      thumbs: {
        swiper: swiperThumbs, 
      },
    });
  </script>

</body>
</html>
